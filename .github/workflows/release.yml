name: Release (binary XCFramework)

# Builds the binary SimulaAdSDK.xcframework with the PINNED toolchain and attaches it to a
# DRAFT GitHub Release. Nothing else — no tagging, no pod push. Publishing is manual:
#
#   1. Run scripts/make-release-manifest.sh <version> <checksum> (checksum is in the draft
#      release notes), commit, tag <version>, push the tag.
#   2. Publish the draft release against that tag.
#   3. pod trunk push SimulaAdSDK.podspec (the :http source resolves to the published asset).
#   4. Smoke-test the demo app.
#
# Test gates (Debug + Release/-O + iOS Simulator) run in CI on every PR/push
# (.github/workflows/ci.yml) — release from a green main.
#
# WHY BINARY: affected host Xcodes (Swift 6.1–6.3 optimizers) miscompile Swift Concurrency
# shapes in source SDKs into task-teardown aborts inside host apps.
# History: .cursor/skills/swift-concurrency-task-shape/SKILL.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match SimulaAdSDK.podspec s.version and SIMULA_SDK_VERSION)"
        required: true

env:
  # PINNED, VALIDATED builder toolchain. Bump only after the Release-lane (-O) suite
  # passes on the new version. Do NOT use latest-stable here: the binary bakes in this
  # toolchain's codegen, so it must be a deliberate choice.
  XCODE_VERSION: "26.4.1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-upload:
    # macOS 26 runner required: Xcode 26.4.x does not install on macOS 15 (Sequoia) images.
    # Keep this in lockstep with XCODE_VERSION above when either changes.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Artifact-labeling guard: the binary embeds SIMULA_SDK_VERSION (telemetry), so a
      # mismatched input would ship a mislabeled framework.
      - name: Verify version sync
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          grep -q "s.version          = \"$V\"" SimulaAdSDK.podspec \
            || { echo "::error::podspec s.version != $V"; exit 1; }
          grep -q "let SIMULA_SDK_VERSION = \"$V\"" Sources/SimulaAdSDK/Telemetry/Telemetry.swift \
            || { echo "::error::SIMULA_SDK_VERSION != $V"; exit 1; }

      # The one test gate that cannot live in CI: CI validates latest-stable, but the binary
      # bakes in THIS pinned toolchain's codegen. Run the optimized (-O) suite on the exact
      # compiler that produces the shipped artifact to catch task-teardown miscompiles.
      - name: Validate pinned toolchain (optimized test suite)
        run: swift test -c release -Xswiftc -enable-testing

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Create draft release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          CHECKSUM=$(cat build/SimulaAdSDK.xcframework.zip.checksum)
          # NOTE: a DRAFT release does not create the git tag. But if this draft is
          # published while tag $V does not exist yet, GitHub creates the tag at this
          # workflow's (source-manifest) commit and SPM consumers silently build from
          # source — hence the warning below. Push the binary-manifest tag FIRST.
          {
            printf '%s\n' "**Do NOT publish this draft until tag \`$V\` exists.** Publishing without the tag makes GitHub create \`$V\` on a source-manifest commit, and SPM consumers would silently build from source instead of this binary."
            printf '%s\n' ""
            printf '%s\n' "Publish sequence:"
            printf '%s\n' "1. \`scripts/make-release-manifest.sh $V $CHECKSUM\`"
            printf '%s\n' "2. Commit, tag \`$V\`, push the tag"
            printf '%s\n' "3. Publish this draft (it will attach to the pushed tag)"
            printf '%s\n' "4. \`pod trunk push SimulaAdSDK.podspec\`"
            printf '%s\n' "5. Validate on the demo app"
            printf '%s\n' ""
            printf '%s\n' "Binary XCFramework built with Xcode ${{ env.XCODE_VERSION }} (dSYMs embedded). SPM checksum: \`$CHECKSUM\`"
          } > release-notes.md
          gh release create "$V" \
            --draft \
            --title "$V" \
            --notes-file release-notes.md \
            "build/SimulaAdSDK.xcframework.zip"
