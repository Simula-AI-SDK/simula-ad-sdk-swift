name: Release XCFramework and CocoaPods

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match the podspec and telemetry version)"
        required: true
        type: string

env:
  # The binary bakes in this toolchain's codegen. Bump only after validating the
  # optimized suite against the replacement compiler.
  XCODE_VERSION: "26.4.1"
  COCOAPODS_DISABLE_STATS: "true"

concurrency:
  group: swift-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: macos-26
    timeout-minutes: 90
    environment: Cocoa Pod
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Validate source and version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${COCOAPODS_TRUNK_TOKEN:-}" ]] || {
            echo "::error::Cocoa Pod environment is missing COCOAPODS_TRUNK_TOKEN"
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Releases must be dispatched from main"
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "::error::Version must be semantic versioning without a leading v"
            exit 1
          }
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "::error::Release checkout is not the current origin/main commit"
            exit 1
          }
          SUCCESSFUL_RUNS=$(gh run list \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length')
          [[ "$SUCCESSFUL_RUNS" -gt 0 ]] || {
            echo "::error::Release commit must have a successful CI run"
            exit 1
          }
          grep -Fq '.target(' Package.swift && ! grep -Fq '.binaryTarget(' Package.swift || {
            echo "::error::main must contain the source Package.swift manifest"
            exit 1
          }
          grep -Fq "s.version          = \"$VERSION\"" SimulaAdSDK.podspec || {
            echo "::error::podspec version does not match $VERSION"
            exit 1
          }
          grep -Fq "let SIMULA_SDK_VERSION = \"$VERSION\"" \
            Sources/SimulaAdSDK/Telemetry/Telemetry.swift || {
              echo "::error::telemetry version does not match $VERSION"
              exit 1
            }
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Git tag $VERSION already exists"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub release $VERSION already exists"
            exit 1
          fi
          if pod trunk info SimulaAdSDK | grep -Fq -- "- $VERSION ("; then
            echo "::error::CocoaPods version $VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Run optimized tests with release compiler
        run: swift test -c release -Xswiftc -enable-testing

      - name: Run optimized iOS tests with release compiler
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -er '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          xcodebuild test \
            -scheme SimulaAdSDK \
            -configuration Release \
            -destination "id=$UDID" \
            ENABLE_TESTABILITY=YES

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Generate release manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHECKSUM=$(<build/SimulaAdSDK.xcframework.zip.checksum)
          ./scripts/make-release-manifest.sh "$VERSION" "$CHECKSUM"
          [[ "$(git diff --name-only)" == $'Package.swift\nSimulaAdSDK.podspec' ]] || {
            echo "::error::Release generation changed unexpected files"
            git diff --name-only
            exit 1
          }

      - name: Validate CocoaPods package locally
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/pod-staging"
          mkdir -p "$STAGING"
          cp SimulaAdSDK.podspec "$STAGING/"
          ditto build/SimulaAdSDK.xcframework "$STAGING/SimulaAdSDK.xcframework"
          pod lib lint "$STAGING/SimulaAdSDK.podspec" --allow-warnings --verbose

      - name: Create and push binary release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift SimulaAdSDK.podspec
          git commit -m "Point release manifests at the $VERSION binary XCFramework."
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHECKSUM=$(<build/SimulaAdSDK.xcframework.zip.checksum)
          publish_release() {
            gh release create "$VERSION" \
              --verify-tag \
              --generate-notes \
              --title "$VERSION" \
              --notes "Binary XCFramework built with Xcode $XCODE_VERSION. SwiftPM checksum: \`$CHECKSUM\`." \
              "$@" \
              build/SimulaAdSDK.xcframework.zip \
              build/SimulaAdSDK.xcframework.zip.checksum
          }
          if [[ "$VERSION" == *-* ]]; then
            publish_release --prerelease
          else
            publish_release
          fi

      - name: Verify published asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/release-verify"
          mkdir -p "$VERIFY_DIR"
          gh release download "$VERSION" \
            --pattern SimulaAdSDK.xcframework.zip \
            --dir "$VERIFY_DIR"
          EXPECTED=$(<build/SimulaAdSDK.xcframework.zip.checksum)
          ACTUAL=$(swift package compute-checksum "$VERIFY_DIR/SimulaAdSDK.xcframework.zip")
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Published XCFramework checksum does not match the validated artifact"
            exit 1
          }

      - name: Publish to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          pod trunk push "$RUNNER_TEMP/pod-staging/SimulaAdSDK.podspec" \
            --allow-warnings \
            --verbose
