name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test (iOS) & release build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Guard against reintroducing the Swift-concurrency shapes that affected
      # optimizers (Swift 6.1–6.3) miscompile into task-teardown aborts in host
      # apps ("freed pointer was not the last allocation"). Full rules + history:
      # .cursor/skills/swift-concurrency-task-shape/SKILL.md
      - name: Lint concurrency task shapes
        run: |
          set -euo pipefail
          fail=0
          if grep -rnE 'try\? await' Sources/; then
            echo '::error::`try? await` is banned in SDK code — use explicit do/catch (see .cursor/skills/swift-concurrency-task-shape/SKILL.md)'
            fail=1
          fi
          if grep -rnE 'async let' Sources/; then
            echo '::error::`async let` is banned in SDK code — use sequential await or a task group (see .cursor/skills/swift-concurrency-task-shape/SKILL.md)'
            fail=1
          fi
          exit $fail

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compile (macOS slice, fail fast)
        run: swift build -v

      - name: Run all tests on iOS Simulator   # validates #if os(iOS) code
        run: |
          set -euo pipefail
          # Resolve an available iPhone simulator at runtime so the gate doesn't
          # break when the runner image ships a different device/OS set.
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name|test("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -scheme SimulaAdSDK \
            -destination "id=$UDID"

      # Optimized-build lane: the Swift 6.1–6.3 task-teardown miscompile only manifests in
      # optimizer builds, which debug `swift test` can never catch. Runs the whole suite
      # under -O (a regression aborts the test process).
      - name: Run tests optimized (release configuration)
        run: swift test -c release -Xswiftc -enable-testing

      - name: Build artifact (release + iOS)
        run: |
          swift build -c release
          xcodebuild build \
            -scheme SimulaAdSDK \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator'

      # The binary release artifact requires a module-stable interface. Fail PRs that break
      # library evolution here rather than at release time (scripts/build-xcframework.sh).
      - name: Check library evolution (binary distribution readiness)
        run: |
          xcodebuild build \
            -scheme SimulaAdSDK \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO
